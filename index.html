<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Portfolio</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div class="card-container">
            <div class="card-flipper">
                
                <div class="card-front">
                    <h1>Project One</h1>
                    <p>A professional 3D interactive card. Click below to see the back.</p>
                    <button class="flip-btn">Flip to Contact</button>
                </div>

                <div class="card-back">
                    <h3>Send a Message</h3>
                    <form class="contact-form">
                        <input type="text" placeholder="Your Name" required>
                        <textarea placeholder="Your Message" rows="3"></textarea>
                        <button type="submit" class="send-btn">Send Now</button>
                    </form>
                    <button class="flip-btn secondary">Go Back</button>
                </div>

            </div>
        </div>

        <div class="card-container">
            <div class="card-flipper">
                
                <div class="card-front">
                    <h1>Project Two</h1>
                    <p>Another project showcasing your web development skills.</p>
                    <button class="flip-btn">Flip for Info</button>
                </div>

                <div class="card-back">
                    <h3>Project Details</h3>
                    <p>Built with HTML, CSS, and JavaScript.</p>
                    <p>Hosted on Vercel.</p>
                    <button class="flip-btn secondary">Go Back</button>
                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
